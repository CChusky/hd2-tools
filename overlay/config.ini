# HD2 Target Overlay - config
# lang: zh / en
lang=zh
# show_panel: 显示锁定信息面板 (1/0)
show_panel=1
# show_line: 显示模型轮廓线框 (1/0)
show_line=1
# show_mark: 显示命中标记 (1/0)
show_mark=1
# show_hint: 显示底部热键提示 (1/0)
show_hint=1
# scale: 面板缩放 (0.8 - 2.0)
scale=1.0
# panel_x / panel_y: 面板左上角位置（像素，相对 overlay 所在屏幕左上）
panel_x=16
panel_y=16
# monitor: 显示在哪个屏幕 (-1=跟随游戏窗口[默认] 0=主屏 1/2/...=第N个显示器)
monitor=-1
